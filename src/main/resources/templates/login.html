<!DOCTYPE html>
<html lang="en"  xmlns:th="http://www.thymeleaf.org"
      th:replace="~{base::layout(~{::section})}">
<head>
    <meta charset="UTF-8">
    <title>Title</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">

    <link href='https://unpkg.com/boxicons@2.1.4/css/boxicons.min.css' rel='stylesheet'>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css" integrity="sha512-Kc323vGBEqzTmouAECnVceyQqyqdsSiqLQISBL29aUW4U/M7pSPA/gEUZQqv1cwx4OnYxTxve5UMg5GT6L4JJg==" crossorigin="anonymous" referrerpolicy="no-referrer" />
    <link rel="stylesheet" href="/css/style.css">
</head>
<body>
<section>
    <div class="container mt-5 p-5">
        <div class="row">
            <!-- Logo Laviva bằng chữ -->
            <div class="col-md-6 d-flex flex-column align-items-center justify-content-center text-center p-5">
                <h1 class="fw-bold text-primary" style="font-family: 'Pacifico', cursive; font-size: 5.8rem; color: #0d6efd;">Laviva</h1>
                <h4  class="mt-3 text-dark">Welcome to Laviva Hotel</h4>
                <p class="text-secondary" style="max-width: 400px;">
                    Experience comfort and elegance with top-class hospitality. Your perfect stay starts here.
                </p>
            </div>

            <div class="col-md-6 p-5">
                <div class="card shadow p-3 mb-5 bg-body-light rounded">
                    <div class="card-header">
                        <p class="fs-4 text-center">Login</p>
                        <div th:if="${param.error}" class="alert alert-danger text-center ">
                            Invalid username or password. Please try again
                        </div>

                        <div th:if="${param.logout}" class="alert alert-success text-center">
                            Logout Success
                        </div>
                    </div>

                    <div class="card-body">
                        <form action="/login" method="post">
                            <div class="mb-3">
                                <label class="form-label">Email</label>
                                <input class="form-control" name="username" type="email">
                            </div>

                            <div class="mb-3">
                                <label class="form-label">Password</label>
                                <input class="form-control" name="password" type="password">
                            </div>
                            <button type="submit" class="btn bg-primary text-white col-md-12" >Login</button>
                        </form>
                    </div>

                    <div class="card-footer text-center">
                        <a href="/forgot-password" class="text-decoration-none">Forgot Password</a><br>
                        Don't have an account? <a href="/register" class="text-decoration-none">Create one</a>

                    </div>

                </div>

            </div>
        </div>
    </div>



</section>



<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js" integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz" crossorigin="anonymous"></script>

</body>
</html>
