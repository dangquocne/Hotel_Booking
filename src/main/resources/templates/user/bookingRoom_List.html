<!DOCTYPE html>
<html lang="en"  xmlns:th="http://www.thymeleaf.org"
      th:replace="~{base::layout(~{::section})}">
<head>
    <meta charset="UTF-8">
    <title>Title</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">

    <link href='https://unpkg.com/boxicons@2.1.4/css/boxicons.min.css' rel='stylesheet'>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css" integrity="sha512-Kc323vGBEqzTmouAECnVceyQqyqdsSiqLQISBL29aUW4U/M7pSPA/gEUZQqv1cwx4OnYxTxve5UMg5GT6L4JJg==" crossorigin="anonymous" referrerpolicy="no-referrer" />
    <link rel="stylesheet" href="/css/style.css">
</head>
<body>
<section>

    <div class="container mt-5 p-5  ">
        <form action="/user/save-bookingRoomForList" method="post" id="bookings" novalidate>
            <div class="row">
                <!-- RIGHT: Booking Form -->

                <div class="col-md-6 offset-md-3">
                    <div class="card shadow mb-4 bg-body-light">
                        <div class="card-body p-4">
                            <p class="fs-3 fw-bold text-center mb-4">Reserve Room</p>

                            <div class="mb-3">
                                <label class="form-label">Full Name:</label>
                                <input type="text" name="name" class="form-control" required >
                            </div>

                            <div class="mb-3">
                                <label class="form-label">Email:</label>
                                <input type="text" name="email" class="form-control" required >
                            </div>
                            <div class="row">
                                <div class="col-md-6 mb-3">
                                    <label class="form-label">Mobile Number</label>
                                    <input class="form-control" name="mobileNumber" type="number" required>
                                </div>
                                <div class="col-md-6 mb-3">
                                    <label class="form-label">Total Day</label>
                                    <input class="form-control" name="totalDay" type="number" required>
                                </div>
                            </div>

                            <h5 class="fw-bold mt-1">Loading Period</h5>
                            <div class="row">
                                <div class="col-md-6 mb-3">
                                    <label class="form-label">Check-In Date:</label>
                                    <input type="date" name="checkIn" class="form-control" required>
                                </div>
                                <div class="col-md-6 mb-3">
                                    <label class="form-label">Check-Out Date:</label>
                                    <input type="date" name="checkOut" class="form-control"  required>
                                </div>
                            </div>
                            <div class="row">
                                <div class="mb-3">
                                    <label class="form-label">Select Payment Type</label>
                                    <select class="form-control" name="paymentType" required>
                                        <option>  </option>
                                        <option value="COD">Pay with Cash After Stay</option>
                                        <option value="ONLINE">Online Payment</option>
                                    </select>

                                </div>

                            </div>




                            <button type="submit" class="btn btn-primary w-100 mt-3">Continue</button>
                        </div>
                    </div>
                </div>
            </div>

        </form>
    </div>

</section>



<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js" integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz" crossorigin="anonymous"></script>

</body>
</html>
