<!DOCTYPE html>
<html lang="en"  xmlns:th="http://www.thymeleaf.org"
      th:replace="~{base::layout(~{::section})}">
<head>
    <meta charset="UTF-8">
    <title>Title</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">

    <link href='https://unpkg.com/boxicons@2.1.4/css/boxicons.min.css' rel='stylesheet'>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css" integrity="sha512-Kc323vGBEqzTmouAECnVceyQqyqdsSiqLQISBL29aUW4U/M7pSPA/gEUZQqv1cwx4OnYxTxve5UMg5GT6L4JJg==" crossorigin="anonymous" referrerpolicy="no-referrer" />
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet"/>
    <link rel="stylesheet" href="/css/style.css">
    <link rel="stylesheet" href="/css/payment.css">
</head>
<body>
<section>
    <div class="container mt-4 p-4 rounded" >
        <div class="row mt-4">

            <div class="text-center mb-4">
                <img src="/images/vnpay-logo.png" alt="VNPAY" width="120">
                <p class="mt-3 fs-5 fw-bold">Chọn phương thức thanh toán</p>
            </div>

            <div class="card payment-card p-3 mb-3">
                <a href="/user/qr-momo" class="text-decoration-none text-dark">
                    <div class="d-flex justify-content-between align-items-center">
                        <div>
                            <small class="fw-bold">Ứng dụng thanh toán hỗ trợ</small><br>
                            <span class="text-danger small">MOMOQR</span>
                        </div>
                        <img src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcQcw-qI8sQ7DqG05x0-uQ2EhrqHggZuzIMorw&s" alt="QR Code" width="40">
                    </div>
                </a>
            </div>

            <div class="card payment-card p-3 mb-3">
                <div class="d-flex justify-content-between align-items-center">
                    <small class="fw-medium">Thẻ nội địa & tài khoản ngân hàng</small>
                    <i class="fas fa-university text-primary fs-4"></i>
                </div>
            </div>

            <div class="card payment-card p-3 mb-3">
                <div class="d-flex justify-content-between align-items-center">
                    <small class="fw-medium">Thẻ thanh toán quốc tế</small>
                    <img src="https://www.mastercard.com.vn/content/dam/public/mastercardcom/vn/vi/personal/find-a-card/Standard_Debit_Mastercard_New_1280x720.jpg" alt="Cards" height="25">
                </div>
            </div>

            <div class="card payment-card p-3 mb-3">
                <div class="d-flex justify-content-between align-items-center">
                    <small class="fw-medium">Ứng dụng <span class="text-danger fw-bold">MOMO</span></small>
                    <img src="https://pay2s.vn/wp-content/uploads/2024/11/momo_icon_square_pinkbg_RGB-1024x1024.png" alt="MOMO App" width="35">
                </div>
            </div>

        </div>
    </div>
</section>



<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js" integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz" crossorigin="anonymous"></script>

</body>
</html>
