<!DOCTYPE html>
<html lang="en"  xmlns:th="http://www.thymeleaf.org"
      th:replace="~{base::layout(~{::section})}">
<head>
    <meta charset="UTF-8">
    <title>Title</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">

    <link href='https://unpkg.com/boxicons@2.1.4/css/boxicons.min.css' rel='stylesheet'>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css" integrity="sha512-Kc323vGBEqzTmouAECnVceyQqyqdsSiqLQISBL29aUW4U/M7pSPA/gEUZQqv1cwx4OnYxTxve5UMg5GT6L4JJg==" crossorigin="anonymous" referrerpolicy="no-referrer" />
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet"/>
    <link rel="stylesheet" href="/css/style.css">
    <link rel="stylesheet" href="/css/payment.css">
</head>
<body>
<section>
    <div class="container p-5">
        <div class="momo-box p-4 bg-white rounded shadow-sm mx-auto" style="max-width: 600px;">
            <div class="d-flex align-items-center justify-content-between">
                <!-- QR Code Section -->
                <div class="qr-code text-center me-3">
                    <img src="/img/payment_img/qrmomo.jpg" alt="QR Code" width="200" class="rounded shadow-sm">
                    <p class="text-primary fw-semibold mt-2">Quét mã để thanh toán</p>
                </div>

                <!-- Payment Details Section -->
                <div class="payment-details text-start">
                    <div class="d-flex align-items-center mb-3">
                        <img src="https://pay2s.vn/wp-content/uploads/2024/11/momo_icon_square_pinkbg_RGB-1024x1024.png" alt="MomoQR Logo" width="40" height="40" class="me-2">
                        <span class="fw-bold fs-5">MomoQR</span>
                    </div>
                    <p class="text-muted mb-2">Giao dịch sẽ hết hạn sau</p>
                    <div class="timer-box mb-3 fw-bold text-white" style="background:#b8cee4; padding: 10px 20px; border-radius: 8px; display: inline-block; font-size: 1.2rem;">
                        14 : 38
                    </div>

                    <h6 class="mb-3 fw-semibold">Thanh toán qua ứng dụng Ngân hàng / Ví điện tử</h6>

                    <div class="bg-light p-3 rounded mb-3 shadow-sm">
                        <div class="mb-2">Thanh toán đặt phòng <strong>1745593815436</strong></div>
                        <div class="d-flex justify-content-between align-items-center">
                            <span class="text-primary fw-bold fs-5">500.000 <small>VND</small></span>
                            <a href="#" class="text-decoration-none text-primary small fw-semibold">Xem chi tiết ▼</a>
                        </div>
                    </div>

                    <div class="small">
                        <a href="#" class="text-decoration-none text-primary fw-semibold">Hướng dẫn thanh toán</a>
                    </div>
                </div>
            </div>
        </div>
    </div>
</section>



<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js" integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz" crossorigin="anonymous"></script>

</body>
</html>
