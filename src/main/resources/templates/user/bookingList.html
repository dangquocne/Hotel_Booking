<!DOCTYPE html>
<html lang="en"  xmlns:th="http://www.thymeleaf.org"
      th:replace="~{base::layout(~{::section})}">
<head>
    <meta charset="UTF-8">
    <title>Title</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">

    <link href='https://unpkg.com/boxicons@2.1.4/css/boxicons.min.css' rel='stylesheet'>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css" integrity="sha512-Kc323vGBEqzTmouAECnVceyQqyqdsSiqLQISBL29aUW4U/M7pSPA/gEUZQqv1cwx4OnYxTxve5UMg5GT6L4JJg==" crossorigin="anonymous" referrerpolicy="no-referrer" />
    <link rel="stylesheet" href="/css/style.css">
    <style>

        .room-card {
            background: #fff;
            border-radius: 12px;
            padding: 20px;
            box-shadow: 0 0 10px rgba(0,0,0,0.05);
            margin-bottom: 25px;
        }
        .room-img {
            width: 100%;
            height: 180px;
            object-fit: cover;
            border-radius: 8px;
        }
        .room-title {
            font-weight: 700;
            font-size: 18px;
            margin-bottom: 10px;
        }
        .service-box {
            background: #f9f9f9;
            padding: 15px;
            border-radius: 8px;
        }
        .btn-detail {
            background-color: #33c7e7;
            color: white;
            font-size: 13px;
            border-radius: 6px;
            padding: 6px 12px;
            margin-top: 10px;
        }
        .qty-box input {
            width: 40px;
            text-align: center;
        }
        .summary-price {
            font-size: 18px;
            font-weight: 700;
            color: #2f6236;
        }
        .btn-book {
            background-color: #33c7e7;
            border: none;
            padding: 10px 18px;
            color: white;
            border-radius: 6px;
        }
    </style>
</head>
<body>
<section>

    <div class="container p-4 mt-5" style="max-width: 850px;">
        <div class="text-end mb-3 mt-10">
            <a th:href="@{'/user/deleteAll'}" class="btn btn-sm btn-outline-secondary">Xóa lựa chọn</a>
        </div>

        <!-- Room 1 -->
        <div class="room-card d-md-flex justify-content-between align-items-center" th:each="b:${bookingLists}" >
            <div class="col-md-4" >
                <div  class="room-title">[[${b.room.title}]]</div>
                <img th:src="@{'/img/room_img/'+${b.room.image1}}" class="room-img">
<!--                <button class="btn btn-detail offset-md-3">xem chi tiết phòng</button>-->
                <a th:href="@{'/view-room/'+${b.room.id}}" class="btn btn-detail offset-md-3">Room Detail</a>
            </div>
            <div class="col-md-7">
                <div class="service-box">
                    <p class="mb-2 fw-bold">Room service:</p>
                    <p class="text-muted">Room currently has no service</p>
                </div>
                <div class="d-flex align-items-center mt-3">
                    <a th:href="@{'/user/booksQuantityUpdate?sy=de&bid='+${b.id}}" class="btn btn-sm btn-outline-secondary">−</a>
                    <input type="text" class="form-control mx-2" th:value="${b.getQuantity()}" style="width: 50px;">
                    <a th:href="@{'/user/booksQuantityUpdate?sy=in&bid='+${b.id}}" class="btn btn-sm btn-outline-secondary">+</a>
                    <span class="ms-auto fw-bold">[[${b.totalPrice}]] VNĐ</span>
                </div>
            </div>
        </div>

        <!-- Room 2 -->
<!--        <div class="room-card d-md-flex justify-content-between align-items-center">-->
<!--            <div class="col-md-4">-->
<!--                <div class="room-title">DOUBLE</div>-->
<!--                <img src="https://duonggiahotel.vn/wp-content/uploads/2023/01/4048e2d8302ae874b13b.jpg" class="room-img">-->
<!--                <button class="btn btn-detail offset-md-3">xem chi tiết phòng</button>-->
<!--            </div>-->
<!--            <div class="col-md-7">-->
<!--                <div class="service-box">-->
<!--                    <p class="mb-2 fw-bold">Dịch vụ phòng:</p>-->
<!--                    <p class="text-muted">Hiện khách sạn chưa có dịch vụ</p>-->
<!--                </div>-->
<!--                <div class="d-flex align-items-center mt-3">-->
<!--                    <button class="btn btn-sm btn-outline-secondary">−</button>-->
<!--                    <input type="text" class="form-control mx-2" value="1" style="width: 50px;">-->
<!--                    <button class="btn btn-sm btn-outline-secondary">+</button>-->
<!--                    <span class="ms-auto fw-bold">7,500,000 VNĐ</span>-->
<!--                </div>-->
<!--            </div>-->
<!--        </div>-->

        <!-- Tổng giá + Đặt -->
        <div class="d-flex justify-content-between align-items-center mt-4">
            <div class="summary-price">Total: [[${totalBookedPrice}]] VNĐ</div>
            <a th:href="@{'/user/loadBookingRoom-List'}" class="btn btn-book">Book now &rarr;</a>
        </div>
    </div>



</section>



<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js" integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz" crossorigin="anonymous"></script>

</body>
</html>
