<!DOCTYPE html>
<html lang="en"  xmlns:th="http://www.thymeleaf.org"
      th:replace="~{base::layout(~{::section})}">
<head>
    <meta charset="UTF-8">
    <title>Title</title>

</head>
<body>
<section>
    <div class="container mt-5 p-5 ">
        <div class="row">


            <div class="col-md-7 p-2 offset-md-3">
                <div class="card shadow p-3 mb-5 bg-body-light rounded">
                    <div class="card-header text-center ">
                        <p class="fs-4 text-center">Register</p>
                        <!-- Hien thi thong bao -->
                        <th:block th:if="${session.sucMsg}">
                            <p class="text-success fw-bold">[[${session.sucMsg}]]</p>
                            <!-- thuc hien de xoa thong bao -->
                            <th:block th:text="${@commonServiceImpl.removeSessionMessage()}"> </th:block>
                        </th:block>

                        <th:block th:if="${session.errorMsg}">
                            <p class="text-danger fw-bold">[[${session.errorMsg}]]</p>
                            <!-- thuc hien de xoa thong bao -->
                            <th:block th:text="${@commonServiceImpl.removeSessionMessage()}"> </th:block>
                        </th:block>

                    </div>

                    <div class="card-body">
                        <form action="/saveRegister" method="post" id="userRegister" novalidate>
                            <div class="row">
                                <div class="col">
                                    <label class="form-label">Full Name</label>
                                    <input class="form-control" name="name" type="text" required>
                                </div>
                                <div class="col">
                                    <label class="form-label">Mobile Number</label>
                                    <input class="form-control" name="mobileNumber" type="number" required>
                                </div>
                            </div>


                            <div class="mb-3 mt-3">
                                <label class="form-label">Email</label>
                                <input class="form-control" name="email" type="email" required>
                            </div>

                            <div class="row">
                                <div class="col">
                                    <label class="form-label">Address</label>
                                    <input class="form-control" name="address" type="text" required>
                                </div>
                                <div class="col">
                                    <label class="form-label">City</label>
                                    <input class="form-control" name="city" type="text" required>
                                </div>
                            </div>


                            <div class="row">
                                <div class="col mt-3">
                                    <label class="form-label">Password</label>
                                    <input class="form-control" name="password" type="password"  id ="pass" required>
                                </div>
                                <div class="col mt-3">
                                    <label class="form-label">Confirm Password</label>
                                    <input class="form-control" name="confirmpassword" type="password" required>
                                </div>
                            </div>



                            <button type="submit"
                                    class="btn bg-primary text-white col-md-12 mt-5" >Register</button>
                        </form>
                    </div>

                    <div class="card-footer text-center">
                        Have an account? <a href="/signin" class="text-decoration-none">Login</a>

                    </div>

                </div>

            </div>
        </div>
    </div>


</section>



<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js" integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz" crossorigin="anonymous"></script>

</body>
</html>
