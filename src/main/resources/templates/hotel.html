<!DOCTYPE html>
<html lang="en"  xmlns:th="http://www.thymeleaf.org"
      th:replace="~{base::layout(~{::section})}">
<head>
    <meta charset="UTF-8">
    <title>Title</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">

    <link href='https://unpkg.com/boxicons@2.1.4/css/boxicons.min.css' rel='stylesheet'>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css" integrity="sha512-Kc323vGBEqzTmouAECnVceyQqyqdsSiqLQISBL29aUW4U/M7pSPA/gEUZQqv1cwx4OnYxTxve5UMg5GT6L4JJg==" crossorigin="anonymous" referrerpolicy="no-referrer" />
    <link rel="stylesheet" href="/css/style.css">
</head>
<body>
<section>

    <div class="container mt-5 p-5 ps-4 pe-4 ">

        <!-- Bộ lọc -->
        <div class="row" >

            <form class="d-flex align-items-center mb-4" action="/hotel" method="get" >
                <label class="me-2 fw-bold" >Filter room by types</label>
                <select name="roomType" class="form-select me-2" style="max-width: 250px;" >
                    <option>All Room Types</option>
                    <option th:each="r:${roomTypes}"  th:value="${r.name}"
                            th:text="${r.name}"
                           th:selected="${r.name==paramValue}">
<!--                      [[${r.name}]]-->
                    </option>

                </select>
                <button type="submit" class="btn btn-primary me-2">Filter</button>
<!--                <a  type="submit" class="btn btn-primary me-2">Filter </a>-->
                <a th:href="@{'/hotel'}" type="reset" class="btn btn-dark">Clear Filter</a>
            </form>

        </div>


        <!-- Danh sách phòng -->
        <div class="row">
            <div class="d-flex flex-column gap-4 ">
                <!-- Phòng 1 -->
                <div class="room-card d-flex align-items-center bg-light p-3" th:each="r:${rooms}">
<!--                    <img src="img/room_img/room1.jpg" alt="Room Image" class="room-image me-3">-->
                    <img alt="" th:src="@{'/img/room_img/'+${r.image1}}" class="room-image me-3">
                    <div class="flex-grow-1">
                        <div class="room-title">[[${r.title}]]</div>
                        <div class="fw-semibold">[[${r.roomType}]]</div>

                        <div class=" fw-semibold" style=" font-size: 1.0rem; color: #b8860b;"> <span class="text-decoration-line-through text-secondary">$[[${r.price}]] VND</span>
                            <span>[[${r.discountPrice}]]VND</span>  / Night </div>

                        <div class="text-muted text-truncate" style="max-width: 450px;">[[${r.description}]]</div>
                    </div>
                    <a th:href="@{'/view-room/'+${r.id}}" class="btn btn-custom ms-3">View/Book Now</a>
                </div>


<!--                &lt;!&ndash; Phòng 2 &ndash;&gt;-->
<!--                <div class="room-card d-flex align-items-center bg-light p-3">-->
<!--                    <img src="img/room_img/roomlux1.jpg" alt="Room Image" class="room-image me-3">-->
<!--                    <div class="flex-grow-1">-->
<!--                        <div class="room-title">La Vela Saigon Hotel</div>-->
<!--                        <div class="fw-semibold">Double Bed Room</div>-->
<!--                        <div class="text-warning fw-semibold">$600 / Night</div>-->
<!--                        <div class="text-muted">Get the celebrity treatment with world-class service at La Vela Saigon Hotel...</div>-->
<!--                    </div>-->
<!--&lt;!&ndash;                    <button class="btn btn-custom ms-3">View/Book Now</button>&ndash;&gt;-->
<!--                    <a href="/view-room" class="btn btn-custom ms-3">View/Book Now</a>-->
<!--                </div>-->
<!--            </div>-->
        </div>
    </div>

    </div>

    <div class=" offset-md-5 ps-4">
        <nav aria-label="Page navigation example">
            <ul class="pagination">
                <li class="page-item">
                    <a class="page-link"  th:href="@{'/hotel?pageNo='+${pageNo - 1}}"
                       th:classappend="${isFirst}?'disabled': ''"
                       aria-label="Previous">
                        <span aria-hidden="true">&laquo;</span>
                    </a>
                </li>
                <li th:each="i:${#numbers.sequence(1,totalPages)} "
                    class="page-item"  th:classappend="${pageNo+1==i}?'active':''">

                    <a class="page-link" th:href="@{'/hotel?pageNo='+${i - 1}}">[[${i}]]</a></li>


                <li class="page-item">
                    <a class="page-link" th:href="@{'/hotel?pageNo='+${pageNo + 1}}"
                       th:classappend="${isLast}?'disabled': ''" aria-label="Next">
                        <span aria-hidden="true">&raquo;</span>
                    </a>
                </li>
            </ul>
        </nav>
    </div>
</section>



<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js" integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz" crossorigin="anonymous"></script>

</body>
</html>
