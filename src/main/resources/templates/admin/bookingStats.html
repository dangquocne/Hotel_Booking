<!DOCTYPE html>
<html lang="en"  xmlns:th="http://www.thymeleaf.org"
      th:replace="~{base::layout(~{::section})}">
<head>
    <meta charset="UTF-8">
    <title>Title</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">

    <link href='https://unpkg.com/boxicons@2.1.4/css/boxicons.min.css' rel='stylesheet'>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css" integrity="sha512-Kc323vGBEqzTmouAECnVceyQqyqdsSiqLQISBL29aUW4U/M7pSPA/gEUZQqv1cwx4OnYxTxve5UMg5GT6L4JJg==" crossorigin="anonymous" referrerpolicy="no-referrer" />
    <link rel="stylesheet" href="/css/style.css">
</head>
<body>
<section>
    <div class="container mt-5 p-3  ">
        <h2 class="text-center mb-6 p-5">Statistical</h2>
        <div class="row mb-4">
            <!-- Số phòng -->
            <div class="col-md-3 mt-2">
                <div class="bg-danger text-white p-3 rounded shadow text-center">
                    <h5 class="m-2 p-1">Number of rooms: <span th:text="${totalRooms}">0</span></h5>
                </div>
            </div>

            <!-- Đã booking -->
            <div class="col-md-3 mt-2">
                <div class="bg-info text-white p-3 rounded shadow text-center">
                    <h5 class="m-2 p-1">Booking: <span th:text="${totalBookings}">0</span></h5>
                </div>
            </div>

            <div class="col-md-3 mt-2">
                <div class="bg-warning text-white p-3 rounded shadow text-center">
                    <H5 class="m-2 p-1 ">Customer: <span th:text="${totalUsers}">0</span></H5>
                </div>
            </div>
            <div class="col-md-3 mt-2">
                <div class="bg-secondary text-white p-3 rounded shadow text-center">
                    <h5 class="m-0 ">Total revenue: <span th:text="${totalRevenue}"></span>VND</h5>
                </div>
            </div>

            <div class="col-md-3 mt-4">
                <div class="bg-white  text-success p-3 rounded shadow text-center">
                    <h5 class="m-2 p-1 ">Total room types: <span th:text="${totalRoomTypes}"></span></h5>
                </div>
            </div>
            <div class="col-md-3 mt-4">
                <div class="bg-white   text-danger    p-3 rounded shadow text-center">
                    <h5 class="m-2 p-1 ">Booking cancelled: <span th:text="${totalBookingCancels}"></span></h5>
                </div>
            </div>
            <div class="col-md-3 mt-4">
                <div class="bg-white  text-primary p-3 rounded shadow text-center">
                    <h5 class="m-2 p-1 ">Total reviews: <span th:text="${totalReviews}"></span></h5>
                </div>
            </div>
            <div class="col-md-3 mt-4">
                <div class="bg-white   text-black p-3 rounded shadow text-center">
                    <h5 class="m-2 p-1 ">Total feedbacks: <span th:text="${totalFeedbacks}"></span></h5>
                </div>
            </div>
        </div>
    </div>






    <div class="card shadow p-5 mb-5">
        <div class="card-body">
            <canvas id="bookingChart" width="100%" height="250" ></canvas>
        </div>
    </div>


    <script >
        const bookingCounts = [[${bookingCounts}]];
        const ctx = document.getElementById('bookingChart').getContext('2d');

        const bookingChart = new Chart(ctx, {
            type: 'bar',
            data: {
                labels: ['Tháng 1', 'Tháng 2', 'Tháng 3', 'Tháng 4', 'Tháng 5', 'Tháng 6', 'Tháng 7', 'Tháng 8', 'Tháng 9', 'Tháng 10', 'Tháng 11', 'Tháng 12'],
                datasets: [{
                    label: 'Number of bookings',
                    data:  bookingCounts, // Dữ liệu mẫu
                    backgroundColor: 'rgba(54, 162, 235, 0.7)',
                    borderColor: 'rgba(54, 162, 235, 1)',
                    borderWidth: 1,
                    borderRadius: 6,
                    barThickness: 50  // Điều chỉnh số này để làm cột hẹp lại (giảm số này sẽ làm cột nhỏ hơn)
                }]
            },
            options: {
                responsive: true,
                maintainAspectRatio: false,
                scales: {
                    x: {
                        barPercentage: 0.3, // Điều chỉnh tỷ lệ chiều rộng cột
                        categoryPercentage: 0.5  // Điều chỉnh tỷ lệ của các nhóm trên trục x
                    },
                    y: {
                        beginAtZero: true,
                        ticks: {
                            precision: 0
                        }
                    }
                },
                plugins: {
                    title: {
                        display: true,
                        text: 'Chart of number of bookings by month',
                        font: {
                            size: 16
                        }
                    },
                    legend: {
                        display: false
                    }
                }
            }
        });
    </script>
</section>




<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js" integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz" crossorigin="anonymous"></script>

</body>
</html>
