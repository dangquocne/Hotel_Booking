<!DOCTYPE html>
<html lang="en"  xmlns:th="http://www.thymeleaf.org"
      th:replace="~{base::layout(~{::section})}">
<head>
    <meta charset="UTF-8">
    <title>Title</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">

    <link href='https://unpkg.com/boxicons@2.1.4/css/boxicons.min.css' rel='stylesheet'>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css" integrity="sha512-Kc323vGBEqzTmouAECnVceyQqyqdsSiqLQISBL29aUW4U/M7pSPA/gEUZQqv1cwx4OnYxTxve5UMg5GT6L4JJg==" crossorigin="anonymous" referrerpolicy="no-referrer" />
    <link rel="stylesheet" href="/css/style.css">
</head>
<body>
<section>
    <div class="container-fluid mt-5 p-7 mb-5">
        <div class="row">
            <p class="text-center fs-2 m-3">All User</p>
            <!-- Hien thi thong bao -->
            <th:block th:if="${session.sucMsg}">
                <p class="text-success fw-bold">[[${session.sucMsg}]]</p>
                <!-- thuc hien de xoa thong bao -->
                <th:block th:text="${@commonServiceImpl.removeSessionMessage()}"> </th:block>
            </th:block>

            <th:block th:if="${session.errorMsg}">
                <p class="text-danger fw-bold">[[${session.errorMsg}]]</p>
                <!-- thuc hien de xoa thong bao -->
                <th:block th:text="${@commonServiceImpl.removeSessionMessage()}"> </th:block>
            </th:block>
        </div>
            <hr>

            <a href="/admin/" class="fs-5 m-3"><i class="fa-solid fa-arrow-left"></i> Back</a>

            <div class="card card-sh">
                <div class="card-body ">
                    <table class="table">
                        <thead>
                        <tr >
                            <th scope="col">Sl No</th>
                            <th scope="col">Profile</th>
                            <th scope="col">Name</th>
                            <th scope="col">Email</th>
                            <th scope="col">Mobile Phone</th>
                            <th scope="col">Address</th>
                            <th scope="col">Status</th>
                            <th scope="col">Action</th>
                        </tr>
                        </thead>
                        <tbody>
                        <tr th:each="u,c:${users}">
                            <th scope="row">[[${c.count}]]</th>
                            <td><img th:src="@{'/img/profile_img/'+${u.profileImage}}" width="70px" height="70px">
                            </td>

                            <td>[[${u.name}]]</td>
                            <td>[[${u.email}]]</td>
                            <td>[[${u.mobileNumber}]]</td>
                            <td>[[${u.address +','+u.city}]]</td>
                            <td>[[${u.isEnable}]]</td>
                            <td>
                                <a th:href="@{'/admin/updateSts?status=true&id='+${u.id}}" class="btn btn-primary btn-sm"> Active </a>
                                <a th:href="@{'/admin/updateSts?status=false&id='+${u.id}}"  class="btn btn-danger btn-sm">InActive  </a>
                            </td>

                        </tr>

                        </tbody>
                    </table>


                </div>



            </div>
        </div>
    </div>




</section>



<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js" integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz" crossorigin="anonymous"></script>

</body>
</html>
