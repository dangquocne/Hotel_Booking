<!DOCTYPE html>
<html lang="en"  xmlns:th="http://www.thymeleaf.org"
      th:replace="~{base::layout(~{::section})}">
<head>
    <meta charset="UTF-8">
    <title>Title</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">

    <link href='https://unpkg.com/boxicons@2.1.4/css/boxicons.min.css' rel='stylesheet'>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css" integrity="sha512-Kc323vGBEqzTmouAECnVceyQqyqdsSiqLQISBL29aUW4U/M7pSPA/gEUZQqv1cwx4OnYxTxve5UMg5GT6L4JJg==" crossorigin="anonymous" referrerpolicy="no-referrer" />
    <link rel="stylesheet" href="/css/style.css">
</head>
<body>
<section>
    <div class="container-fluid p-5 mt-5">
        <div class="row ">
            <div class="col-md-3 offset-md-5">
                <div class="card card-sh">
                    <div class="card-header text-center">
                        <p class="fs-4">Edit Room Type</p>
                        <!-- Hien thi thong bao -->
                        <th:block th:if="${session.sucMsg}">
                            <p class="text-success fw-bold">[[${session.sucMsg}]]</p>
                            <!-- thuc hien de xoa thong bao -->
                            <th:block th:text="${@commonServiceImpl.removeSessionMessage()}"> </th:block>
                        </th:block>

                        <th:block th:if="${session.errorMsg}">
                            <p class="text-danger fw-bold">[[${session.errorMsg}]]</p>
                            <!-- thuc hien de xoa thong bao -->
                            <th:block th:text="${@commonServiceImpl.removeSessionMessage()}"> </th:block>
                        </th:block>

                    </div>

                    <div class="card-body">
                        <form action="/admin/updateRoomType" method="post" >

                            <div class="mb-3">
                                <input type="hidden" name="id" th:value="${roomType.id}">
                                <label>Name Room Type</label> <input type="text" name="name"
                                                                     class="form-control" th:value="${roomType.name}">
                            </div>

                            <div class="mb-3">
                                <label>Status</label>
                                <div class="form-check">
                                    <input class="form-check-input" type="radio" value="true" name="isActive" id="flexRadioDefault1" th:checked="${roomType.isActive==true}">
                                    <label class="form-check-label" for="flexRadioDefault1">
                                        Active
                                    </label>
                                </div>
                                <div class="form-check">
                                    <input class="form-check-input" type="radio" value="false" name="isActive" id="flexRadioDefault2" th:checked="${roomType.isActive==false}">
                                    <label class="form-check-label" for="flexRadioDefault2">
                                        Inactive
                                    </label>
                                </div>
                            </div>



                            <button class="btn btn-success col-md-12 mt-2">Save</button>

                        </form>
                    </div>
                </div>
            </div>

        </div>
    </div>

</section>



<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js" integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz" crossorigin="anonymous"></script>

</body>
</html>
